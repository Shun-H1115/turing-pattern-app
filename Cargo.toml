[package]
name = "turing-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An interactive Gray-Scott reaction-diffusion desktop studio"
license = "MIT"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
png = "=0.18.1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 2
